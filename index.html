<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>Live — Kubrusly Basso Team</title>
<style>
  :root { --bg:#0b0b0c; --card:#18181b; --fg:#f4f4f5; --mut:#a1a1aa; --gold:#e9c46a; --gold2:#f3e08a; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:28px 16px 40px; min-height:100dvh; display:flex; flex-direction:column; gap:18px; text-align:center; }
  .logo { width:100%; max-width:360px; margin:0 auto; display:block; }
  .tag { color:var(--gold); letter-spacing:.3em; font-size:12px; font-weight:700; }
  .card { background:var(--card); border-radius:16px; padding:20px; line-height:1.5; }
  .spin { width:34px; height:34px; border:3px solid #3f3f46; border-top-color:var(--gold); border-radius:50%; margin:6px auto 0; animation:r 1s linear infinite; }
  @keyframes r { to { transform:rotate(360deg); } }
  a.btn { display:block; background:linear-gradient(90deg,var(--gold),var(--gold2)); color:#1c1917; border-radius:14px; padding:16px; font-weight:800; text-decoration:none; font-size:17px; margin-top:10px; }
  .mut { color:var(--mut); font-size:14px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="Kubrusly Basso Team">
  <div class="tag">● LIVE</div>
  <div class="card" id="box">
    <div class="spin"></div>
    <p class="mut">Conectando… · Connecting…</p>
  </div>
  <div id="sums"></div>
</main>
<script>
// O Mac do palestrante atualiza url.json a cada início com o link do túnel do dia.
const box = document.getElementById("box");
async function check() {
  let cfg = null;
  try { cfg = await (await fetch("url.json?t=" + Date.now(), { cache: "no-store" })).json(); } catch (e) {}
  if (cfg && cfg.url) {
    try {
      const r = await fetch(cfg.url + "/info?t=" + Date.now(), { cache: "no-store" });
      if (r.ok) { location.replace(cfg.url + "/" + location.search); return; }
    } catch (e) {}
  }
  box.innerHTML = `<div class="spin"></div>
    <p><b>La transmisión aún no ha comenzado.</b><br>The live translation hasn't started yet.</p>
    <p class="mut">Esta página se actualizará sola · This page will refresh automatically</p>`;
  const sums = (cfg && cfg.resumos) || [];
  document.getElementById("sums").innerHTML = sums.length ? `<div class="card"><b>📄 Resúmenes · Summaries</b>` +
    sums.map(s => `<p class="mut" style="margin:14px 0 0">${s.titulo || ""} — ${s.data || ""}</p>` +
      Object.entries(s.links).map(([l, href]) => `<a class="btn" href="${href}">${{ es: "Español", en: "English", pt: "Português" }[l] || l}</a>`).join("")).join("") + `</div>` : "";
  setTimeout(check, 8000);
}
check();
</script>
</body>
</html>
